[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paisa-lens-api"
version = "0.1.0"
description = "PaisaLens personal finance intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0", "pydantic-settings>=2.4.0", "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
